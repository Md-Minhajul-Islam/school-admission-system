name: school-admission

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: "${DATABASE_URL:-Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres}"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    environment:
      TEST_DATABASE_URL: "${TEST_DATABASE_URL:-Host=db;Port=5432;Database=postgres;Username=postgres;Password=postgres}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
